<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>JS Injector</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <svg class="icon-defs" aria-hidden="true">
    <defs>
      <symbol id="i-bolt" viewBox="0 0 24 24">
        <path d="M13.5 2 4.5 13.5H11l-.5 8.5 9-11.5H13z" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
      </symbol>
      <symbol id="i-play" viewBox="0 0 24 24">
        <path d="M8 5.5v13l11-6.5z" />
      </symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24">
        <path d="M4 20h4l10-10-4-4L4 16zM14.5 5.5l4 4 1.8-1.8a1.5 1.5 0 0 0 0-2.1l-1.9-1.9a1.5 1.5 0 0 0-2.1 0z" />
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M9 3h6l1 2h4v2H4V5h4zM6 8h12l-1 12.2A2 2 0 0 1 15 22H9a2 2 0 0 1-2-1.8zm4 3v8h1.5v-8zm4 0v8h1.5v-8z" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="M5 12.5 10 17.5 19 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <path d="M11 4a7 7 0 1 0 4.2 12.6l4.1 4.1 1.4-1.4-4.1-4.1A7 7 0 0 0 11 4m0 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
      </symbol>
      <symbol id="i-grip" viewBox="0 0 24 24">
        <circle cx="9" cy="6" r="1.7" />
        <circle cx="15" cy="6" r="1.7" />
        <circle cx="9" cy="12" r="1.7" />
        <circle cx="15" cy="12" r="1.7" />
        <circle cx="9" cy="18" r="1.7" />
        <circle cx="15" cy="18" r="1.7" />
      </symbol>
    </defs>
  </svg>

  <header>
    <h1><svg class="icon icon-brand" aria-hidden="true"><use href="#i-bolt" /></svg>JS Injector</h1>
    <button id="newBtn" class="btn btn-primary" type="button">
      <svg class="icon" aria-hidden="true"><use href="#i-plus" /></svg>New Script
    </button>
  </header>

  <div id="searchRow" class="search" hidden>
    <svg class="icon search-icon" aria-hidden="true"><use href="#i-search" /></svg>
    <input id="searchInput" type="text" placeholder="Search scripts" autocomplete="off" aria-label="Search scripts by name" />
    <button id="clearSearchBtn" class="btn btn-icon search-clear" type="button" title="Clear search" aria-label="Clear search" hidden>
      <svg class="icon" aria-hidden="true"><use href="#i-close" /></svg>
    </button>
  </div>

  <div id="status" class="status" hidden></div>

  <section id="form" class="form" hidden>
    <input id="nameInput" type="text" placeholder="Script name" maxlength="100" />

    <div class="code-editor" id="codeEditor">
      <div class="code-editor-gutter" id="codeGutter"><div>1</div></div>
      <div class="code-editor-body">
        <pre class="code-editor-highlight" id="codeHighlight"><code></code></pre>
        <textarea
          id="codeInput"
          class="code-editor-input"
          placeholder="// Your JavaScript code here"
          spellcheck="false"
          wrap="off"
          autocapitalize="off"
          autocomplete="off"
        ></textarea>
      </div>
    </div>

    <div class="form-actions">
      <button id="saveBtn" class="btn btn-primary" type="button">
        <svg class="icon" aria-hidden="true"><use href="#i-check" /></svg>Save
      </button>
      <button id="cancelBtn" class="btn" type="button">Cancel</button>
    </div>
  </section>

  <ul id="list" class="list"></ul>

  <p id="emptyState" class="empty-state" hidden>No scripts yet. Click "New Script" to add one.</p>

  <script src="popup.js"></script>
</body>
</html>
